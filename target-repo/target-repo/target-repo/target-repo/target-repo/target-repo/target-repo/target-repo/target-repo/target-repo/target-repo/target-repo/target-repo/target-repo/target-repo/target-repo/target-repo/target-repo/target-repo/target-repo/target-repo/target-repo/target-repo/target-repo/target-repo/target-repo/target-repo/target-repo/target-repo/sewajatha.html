<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sewajatha</title>
    <link rel="stylesheet" href="style/lib/bootstrap.min.css?v=2.0" />
    <link rel="stylesheet" href="style/lib/jquery.dataTables.min.css?v=2.0" />
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css?v=2.0" />
    <link rel="stylesheet" href="style/style.css?v=2.0" />
    <link rel="stylesheet" href="resources/fontawesome-free-6.5.2-web/css/all.min.css?v=2.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-select/1.14.0-beta3/css/bootstrap-select.min.css?v=2.0" />
    <!-- Select2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <style>
      body * {
        font-size: 12px !important;
        font-family: Arial, sans-serif;
      }
      body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }
      .card-body {
        padding: 0px;
        padding-top: 10px;
      }
      .display-none {
        display: none;
      }
      .bg-primary,
      .badge-primary,
      .btn-success {
        background-color: #8b0002 !important;
      }
      .w-100 {
        width: 90% !important;
      }
      .buttons-html5 {
        display: none;
      }
      #mainContainer {
        display: flex;
        flex-direction: column;
        padding: 20px;
      }

      #formContainer {
        margin-bottom: 5px;
        padding: 0px 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
        background-color: #f9f9f9;
      }

      #tableContainer {
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 5px;
        background-color: #fff;
      }
      .form-row *,
      .select2-container--default {
        font-size: 12px !important;
      }

      .form-group {
        margin-bottom: 15px;
      }

      .form-label {
        font-weight: bold;
      }

      #errorMessage {
        margin-top: 10px;
      }

      h2,
      h1 {
        font-weight: bold;
      }
      .select2-container .select2-selection--multiple {
        border: 1px solid #ced4da;
        border-radius: 0.25rem;
      }
      #dataTable_wrapper {
        display: contents;
      }
      table.dataTable tbody th,
      table.dataTable tbody td {
        padding: 0px 8px;
      }
      .delete-row {
        padding: 5px !important;
        margin: 3px !important;
      }
    </style>
  </head>
  <body>
    <div id="header">
      <div id="topMenu">
        <a href="./index.html" id="c-back" class="sidebar-item">
          <i class="fa fa-arrow-left" aria-hidden="true"></i>
          <span class="sidebar-text">Back</span>
        </a>
        <a href="#" id="clearStorageTrigger" data-toggle="modal" data-target="#clearStorageModal" class="sidebar-item right">
          <i class="fas fa-broom"></i>
          <span class="sidebar-text">Reset</span>
        </a>
        <a href="#" id="refreshStorageTrigger" data-toggle="modal" class="sidebar-item right">
          <i class="fa-solid fa-refresh"></i>
          <span class="sidebar-text">Refresh</span>
        </a>
        <a href="#" id="newStorageTrigger" data-toggle="modal" class="sidebar-item right">
          <i class="fas fa-add"></i>
          <span class="sidebar-text">Add</span>
        </a>
      </div>
    </div>

    <div id="mainContainer">
      <!-- Form Container -->
      <div id="formContainer" class="card shadow-sm">
        <div class="card-body">
          <form id="entryForm">
            <div class="form-row">
              <!-- Add Sewadar Dropdown -->

              <!-- Serial Prefix -->
              <div class="form-group col-md-2">
                <label for="serialPrefix" class="form-label"> <i class="fa fa-hashtag"></i> Serial: </label>
                <input type="text" id="serialPrefix" class="form-control" placeholder="Enter Serial Prefix" required />
              </div>

              <!-- Start Date -->
              <div class="form-group col-md-1">
                <label for="startDate" class="form-label"> <i class="fa fa-calendar"></i> Start Date: </label>
                <input type="date" id="startDate" class="form-control" required />
              </div>

              <!-- End Date -->
              <div class="form-group col-md-1">
                <label for="endDate" class="form-label"> <i class="fa fa-calendar"></i> End Date: </label>
                <input type="date" id="endDate" class="form-control" required />
              </div>
              <div class="form-group col-md-1">
                <label for="inTime" class="form-label"> <i class="fa fa-clock"></i> In Time: </label>
                <input type="time" id="inTime" class="form-control" required />
              </div>

              <!-- Out Time -->
              <div class="form-group col-md-1">
                <label for="outTime" class="form-label"> <i class="fa fa-clock"></i> Out Time: </label>
                <input type="time" id="outTime" class="form-control" required />
              </div>

              <!-- Satsang Area -->
              <div class="form-group col-md-1">
                <label for="satsangArea" class="form-label"> <i class="fa fa-map-marker-alt"></i> Satsang Area: </label>
                <select id="satsangArea" class="form-control select2" required>
                  <option value="">Select Area</option>
                </select>
              </div>

              <!-- Satsang Center -->
              <div class="form-group col-md-2">
                <label for="satsangCenter" class="form-label"> <i class="fa fa-building"></i> Satsang Center: </label>
                <select id="satsangCenter" class="form-control select2" required>
                  <option value="">Select Center</option>
                </select>
              </div>
              <div class="form-group col-md-3">
                <label for="grNo" class="form-label"> <i class="fa fa-plus"></i> Select & Add Sewadar: </label>
                <div class="d-flex">
                  <select id="grNo" class="form-control select2" multiple="multiple" required></select>
                  <button id="addGrNoButton" class="btn btn-success" data-toggle="modal" data-target="#addGrNoModal" style="margin-left: 10px">
                    <i class="fa fa-plus"></i>
                  </button>
                </div>
              </div>
            </div>
            <div id="errorMessage" class="text-danger"></div>
          </form>
        </div>
      </div>

      <!-- Add Gr No Modal -->
      <div class="modal fade" id="addGrNoModal" tabindex="-1" aria-labelledby="addGrNoModalLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="addGrNoModalLabel">Add Sewadar</h5>
              <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <div class="modal-body">
              <form id="addGrNoForm">
                <div class="form-group display-none">
                  <label for="grNoInput">Gr No</label>
                  <input type="text" readonly id="grNoInput" value="No Badge" class="form-control" required />
                </div>
                <div class="form-group">
                  <label for="nameInput">Name</label>
                  <input type="text" id="nameInput" class="form-control" required />
                </div>
                <div class="form-group">
                  <label for="genderInput">Gender</label>
                  <select id="genderInput" class="form-control" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                  </select>
                </div>
                <div class="form-group display-none">
                  <label for="statusInput">Status</label>
                  <input type="text" id="statusInput" value="Open" readonly class="form-control" required />
                </div>
                <div class="form-group display-none">
                  <label for="satsangAreaInput">Area</label>
                  <select id="satsangAreaInput" class="form-control" required>
                    <option value="">Select Area</option>
                  </select>
                </div>
                <div class="form-group display-none">
                  <label for="satsangCenterInput">Satsang Center</label>
                  <select id="satsangCenterInput" class="form-control" required>
                    <option value="">Select Satsang Center</option>
                  </select>
                </div>

                <div id="modalErrorMessage" class="text-danger"></div>
              </form>
            </div>
            <div class="modal-footer">
              <button type="button" id="submitGrNoButton" class="btn btn-primary">Submit</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Error Modal -->
      <div class="modal fade" id="errorModal" tabindex="-1" aria-labelledby="errorModalLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="errorModalLabel">Error</h5>
              <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <div class="modal-body">
              <!-- Error message will be dynamically inserted here -->
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Table Container -->
      <div id="tableContainer">
        <div class="justify-content-between align-items-center mb-3" style="width: fit-content; display: inline !important">
          <h1 class="mb-0" style="font-size: 20px !important; width: fit-content; display: inline">
            Sewadars <span style="font-size: 20px !important" id="recordCount" class="badge badge-primary">0</span>
          </h1>
        </div>

        <table id="dataTable" class="display table table-striped table-bordered" style="width: 100%">
          <thead>
            <tr>
              <th>Gr No</th>
              <th>Name</th>
              <th>Gender</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <button id="exportCustomCSVButton" class="btn btn-primary mt-3"><i class="fa fa-download"></i> Export</button>
        <button id="saveAndExportButton" class="btn btn-primary mt-3" style="float: right"><i class="fa fa-save"></i> Save and Export</button>
      </div>
      <!-- Save Button -->
      <div class="modal fade" id="apiKeyModal" tabindex="-1" aria-labelledby="apiKeyModalLabel">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="apiKeyModalLabel">Enter Password</h5>
              <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <div class="modal-body">
              <div id="errorAPIKey" class="alert alert-danger" role="alert" class="display:none"></div>
              <form id="apiKeyForm">
                <div class="form-group">
                  <label for="apiKeyInput"></label>
                  <input type="password" class="form-control" id="apiKeyInput" placeholder="Enter passwrod" required />
                </div>
              </form>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary" id="submitApiKey">Submit</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="loader" style="display: none">
      <div id="loadingIndicator">
        <div class="spinner"></div>
      </div>
    </div>
    <div class="modal fade" id="clearStorageModal" tabindex="-1" aria-labelledby="clearStorageModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="clearStorageModalLabel">Confirm Action</h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body">Are you sure you want to clear all storage data?</div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-dismiss="modal">No</button>
            <button type="button" class="btn btn-primary" id="clearStorageModalYes">Yes</button>
          </div>
        </div>
      </div>
    </div>
    <!-- Include Required Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.4.min.js?v=2.0"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/2.11.8/umd/popper.min.js?v=2.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js?v=2.0"></script>
    <script src="script/lib/jquery.dataTables.min.js?v=2.0"></script>
    <script src="script/lib/FileSaver.min.js?v=2.0"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js?v=2.0"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js?v=2.0"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js?v=2.0"></script>
    <script src="script/service/Constant.js"></script>
    <script>
      localStorage.removeItem("currentData")
      API_URLS.CURRENT_URL = API_URLS.SEWA_JATHA_FETCH;
      API_KEYS.CURRENT_API_KEY = API_KEYS.SEWAJATHA;
    </script>
    <script src="script/service/StorageService.js?v=2.0"></script>
    <script src="script/service/ExcelService.js?v=2.0"></script>
    <script src="script/service/SewaJatha.js?v=3.2"></script>
    <script src="script/lib/bootstrap-select.min.js?v=2.0"></script>
    <!-- Select2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  </body>
</html>
